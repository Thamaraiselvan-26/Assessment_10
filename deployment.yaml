apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agriculture-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-agriculture
  template:
    metadata:
      labels:
        app: smart-agriculture
    spec:
      containers:
        - name: smart-agriculture-container
          image: thamaraiselvan26/smart-agriculture-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agriculture-service
spec:
  type: NodePort
  selector:
    app: smart-agriculture
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010